<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Timing App</title>
    <link rel="manifest" href="/SprintXMR/manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .banner-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #sprinter-list {
            margin-bottom: 20px;
        }
        #timer {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        #results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #results-table th, #results-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        #results-table th {
            background-color: #f2f2f2;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        /* Position the buttons side by side */
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 20px; /* Add some space between buttons */
        }
        #start-stop.start {
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        #start-stop.stop {
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            background-color: red;
        }
        #export-results {
            margin-top: 20px;
        }
        #false-start {
            background-color: orange;
            color: white;
        }
        #false-start:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }
        #reset-false-start {
            background-color: darkcyan;
            color: white;
            padding: 10px 15px;
            font-size: 0.9rem;
        }
        #reset-false-start:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
        }
        .footer {
            position: static;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: grey;
            color: white;
            text-align: right;
        }
        input[type="text"] {
            width: 100px;
            text-align: center;
        }
        #class-period, #new-sprinter {
            width: 200px;
            text-align: left;
        }
        .status-message {
            font-weight: bold;
            margin-top: 10px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <img src="islanders.png" alt="Islanders" class="banner">
    </div>
    <h1>Sprint Timing App</h1>

    <!-- Class Period Input Field -->
    <label for="class-period">Class Period:</label>
    <input type="text" id="class-period" placeholder="Enter Class Period">
    <br><br>
    <input type="file" id="file-input" accept=".csv, .txt">
    <br><br>
    <button id="load-sprinters">Load Sprinters</button>

    <h2>Add a New Sprinter</h2>
    <input type="text" id="new-sprinter" placeholder="Enter sprinter's name">
    <button id="add-sprinter">Add Sprinter</button>

    <h2>Select a Sprinter</h2>
    <select id="sprinter-list">
        <option value="">-- Select Sprinter --</option>
    </select>

    <h2>Timer</h2>
    <div id="timer">00:00:00</div>

    <!-- Container for buttons -->
    <div class="button-container">
        <button id="false-start" disabled>False Start</button>
        <button id="reset-false-start" disabled>Reset False Start</button>
        <button id="start-stop" class="start">Start</button>
    </div>

    <div class="status-message" id="status-message"></div>

    <h2>Recorded Times</h2>
    <table id="results-table">
        <thead>
            <tr>
                <th>Sprinter</th>
                <th>Attempt 1</th>
                <th>Manual Correction 1</th>
                <th>Attempt 2</th>
                <th>Manual Correction 2</th>
                <th>Attempt 3</th>
                <th>Manual Correction 3</th>
            </tr>
        </thead>
        <tbody id="results-body">
            <!-- Times will be populated here -->
        </tbody>
    </table>

    <button id="export-results">Export Results</button>
    <br><br>
    <button id="clear-data">Clear Data</button>

    <!-- Footer -->
    <div class="footer">
        <p>&#169; 2024 Lewie Tenorio</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script>
    const MAX_ATTEMPTS = 3; // Three timed attempts per sprinter

    let sprinters = [];
    let currentSprinter = null;
    let startTime = null;
    let timerInterval = null;
    let sprintResults = {};
    let timerRunning = false;

    // Prevent accidental page refresh or close
    window.addEventListener('beforeunload', (event) => {
        event.preventDefault();
        event.returnValue = '';  // Shows a confirmation dialog to the user
    });

    document.getElementById('load-sprinters').addEventListener('click', () => {
        const fileInput = document.getElementById('file-input');
        const file = fileInput.files[0];
        if (file) {
            // Use PapaParse to parse the CSV file
            Papa.parse(file, {
                complete: function(results) {
                    sprinters = results.data.map(row => (row[0] || '').trim()).filter(name => name); // Trim and filter any empty names
                    populateSprinterList();
                    document.getElementById('load-sprinters').disabled = true;
                    showStatus('Sprinter list loaded: ' + sprinters.length + ' sprinters.');
                },
                error: function(err) {
                    console.error('Error parsing CSV:', err);
                    showStatus('Error loading CSV file.');
                }
            });
        } else {
            showStatus('Please choose a CSV or TXT file first.');
        }
    });

    // ===== MANUALLY ADD A STUDENT =====
    document.getElementById('add-sprinter').addEventListener('click', addSprinter);
    document.getElementById('new-sprinter').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addSprinter();
    });

    function addSprinter() {
        const newSprinterInput = document.getElementById('new-sprinter');
        const newSprinter = newSprinterInput.value.trim();

        if (!newSprinter) {
            showStatus('Please enter a name before adding.');
            return;
        }
        // Prevent duplicates (case-insensitive)
        if (sprinters.some(name => name.toLowerCase() === newSprinter.toLowerCase())) {
            showStatus('"' + newSprinter + '" is already on the list.');
            return;
        }

        sprinters.push(newSprinter);
        populateSprinterList();

        // Auto-select the newly added sprinter so timing can begin immediately
        const sprinterList = document.getElementById('sprinter-list');
        sprinterList.value = sprinters.length - 1;
        sprinterList.dispatchEvent(new Event('change'));

        newSprinterInput.value = '';
        showStatus('Added "' + newSprinter + '" to the list.');
    }

    function populateSprinterList() {
        const sprinterList = document.getElementById('sprinter-list');
        sprinterList.innerHTML = '<option value="">-- Select Sprinter --</option>';
        sprinters.forEach((sprinter, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = sprinter;
            sprinterList.appendChild(option);
        });
    }

    document.getElementById('sprinter-list').addEventListener('change', (e) => {
        const index = e.target.value;
        currentSprinter = (index === '') ? null : sprinters[index];
        // False Start is only meaningful while the timer is running
        document.getElementById('false-start').disabled = !timerRunning;
        updateResetFalseStartButton();
        if (currentSprinter) {
            showStatus('Selected: ' + currentSprinter + ' (Attempt ' + (getAttemptCount(currentSprinter) + 1) + ' of ' + MAX_ATTEMPTS + ')');
        }
    });

    document.getElementById('start-stop').addEventListener('click', () => {
        const button = document.getElementById('start-stop');
        if (!currentSprinter) {
            showStatus('Select a sprinter before starting the timer.');
            return;
        }
        if (getAttemptCount(currentSprinter) >= MAX_ATTEMPTS) {
            showStatus(currentSprinter + ' has completed all ' + MAX_ATTEMPTS + ' attempts. Select another sprinter or clear their data.');
            return;
        }
        if (!timerRunning) { // Start the timer
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 10);
            button.textContent = 'Stop';
            button.classList.remove('start');
            button.classList.add('stop');
            timerRunning = true;
            document.getElementById('false-start').disabled = false;
            showStatus('Timer running for ' + currentSprinter + '...');
        } else { // Stop the timer
            clearInterval(timerInterval);
            timerRunning = false;
            button.textContent = 'Start';
            button.classList.remove('stop');
            button.classList.add('start');

            // Automatically save the time when stop is pressed
            saveSprintTime();
        }
    });

    // ===== FALSE START (FIXED — now has a working click handler) =====
    document.getElementById('false-start').addEventListener('click', () => {
        if (!timerRunning || !currentSprinter) return;

        clearInterval(timerInterval);
        timerRunning = false;
        startTime = null;

        // Record the false start marker in place of a time
        if (!sprintResults[currentSprinter]) {
            sprintResults[currentSprinter] = [];
        }
        if (sprintResults[currentSprinter].length < MAX_ATTEMPTS) {
            sprintResults[currentSprinter].push('FALSE START');
        }

        const button = document.getElementById('start-stop');
        button.textContent = 'Start';
        button.classList.remove('stop');
        button.classList.add('start');

        displayResults();
        saveResultsToLocal();

        const done = getAttemptCount(currentSprinter) >= MAX_ATTEMPTS;
        showStatus('FALSE START recorded for ' + currentSprinter +
            (done ? ' — all attempts used.' : ' — ready for attempt ' + (getAttemptCount(currentSprinter) + 1) + '.'));

        document.getElementById('false-start').disabled = true;
        document.getElementById('timer').textContent = '00:00:00';
        updateResetFalseStartButton();
    });

    // ===== RESET FALSE START =====
    // Removes the most recent FALSE START marker for the selected sprinter,
    // giving that attempt back so it can be re-timed.
    document.getElementById('reset-false-start').addEventListener('click', () => {
        if (!currentSprinter) {
            showStatus('Select a sprinter first.');
            return;
        }
        const times = sprintResults[currentSprinter] || [];
        const fsIndex = times.lastIndexOf('FALSE START');

        if (fsIndex === -1) {
            showStatus('No FALSE START to reset for ' + currentSprinter + '.');
            updateResetFalseStartButton();
            return;
        }
        if (timerRunning) {
            showStatus('Stop the timer before resetting a FALSE START.');
            return;
        }

        times.splice(fsIndex, 1);  // Remove the most recent FALSE START marker
        displayResults();
        saveResultsToLocal();
        updateResetFalseStartButton();
        showStatus('FALSE START removed for ' + currentSprinter + ' — ready for attempt ' + (getAttemptCount(currentSprinter) + 1) + ' of ' + MAX_ATTEMPTS + '.');
    });

    // Enable the Reset button only when the selected sprinter has a FALSE START on record
    function updateResetFalseStartButton() {
        const resetButton = document.getElementById('reset-false-start');
        const hasFalseStart = currentSprinter && (sprintResults[currentSprinter] || []).includes('FALSE START');
        resetButton.disabled = !hasFalseStart;
    }

    function updateTimer() {
        const elapsed = Date.now() - startTime;

        const milliseconds = ('000' + (elapsed % 1000)).slice(-3);              // Milliseconds part
        const seconds = ('00' + Math.floor((elapsed / 1000) % 60)).slice(-2);   // Seconds part
        const minutes = ('00' + Math.floor((elapsed / 60000) % 60)).slice(-2);  // Minutes part

        document.getElementById('timer').textContent = `${minutes}:${seconds}.${milliseconds}`;
    }

    function getAttemptCount(sprinter) {
        return (sprintResults[sprinter] || []).length;
    }

    function saveSprintTime() {
        if (currentSprinter && !timerRunning) {
            const time = document.getElementById('timer').textContent;
            if (!sprintResults[currentSprinter]) {
                sprintResults[currentSprinter] = [];
            }

            // Save time for Attempt 1, 2, or 3
            if (sprintResults[currentSprinter].length < MAX_ATTEMPTS) {
                sprintResults[currentSprinter].push(time);
            }

            displayResults();
            saveResultsToLocal();

            const done = getAttemptCount(currentSprinter) >= MAX_ATTEMPTS;
            showStatus('Recorded ' + time + ' for ' + currentSprinter +
                (done ? ' — all 3 attempts complete!' : ' — ready for attempt ' + (getAttemptCount(currentSprinter) + 1) + '.'));

            resetTimer();
        }
    }

    function saveResultsToLocal() {
        localStorage.setItem('sprintResults', JSON.stringify(sprintResults));
    }

    window.onload = function() {
        sprintResults = JSON.parse(localStorage.getItem('sprintResults')) || {};
        if (Object.keys(sprintResults).length > 0) {
            displayResults();
        }
        updateResetFalseStartButton();
    };

    function resetTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer').textContent = '00:00:00';
        startTime = null;
        timerRunning = false;

        const button = document.getElementById('start-stop');
        button.textContent = 'Start';
        button.classList.remove('stop');
        button.classList.add('start');

        document.getElementById('false-start').disabled = true;
        updateResetFalseStartButton();
    }

    function showStatus(message) {
        document.getElementById('status-message').textContent = message;
    }

    function displayResults() {
        const resultsBody = document.getElementById('results-body');
        resultsBody.innerHTML = '';
        for (const [sprinter, times] of Object.entries(sprintResults)) {
            const row = document.createElement('tr');
            const sprinterCell = document.createElement('td');
            sprinterCell.textContent = sprinter;
            row.appendChild(sprinterCell);

            // Attempt 1, 2, and 3 — each with its own manual correction
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                const timeCell = document.createElement('td');
                timeCell.textContent = times[i] || '';
                row.appendChild(timeCell);

                // Manual Correction input fields
                const correctionCell = document.createElement('td');
                const correctionInput = document.createElement('input');
                correctionInput.type = 'text';
                correctionInput.value = times[i] || '';
                correctionInput.addEventListener('change', () => {
                    sprintResults[sprinter][i] = correctionInput.value;  // Save the correction
                    saveResultsToLocal();
                });
                correctionCell.appendChild(correctionInput);
                row.appendChild(correctionCell);
            }

            resultsBody.appendChild(row);
        }
    }

    document.getElementById('clear-data').addEventListener('click', () => {
        if (!confirm('Clear ALL recorded results? This cannot be undone.')) return;
        localStorage.removeItem('sprintResults');
        sprintResults = {};
        displayResults();
        showStatus('All recorded results cleared.');
    });

    // Function to export the results to a CSV file
    document.getElementById('export-results').addEventListener('click', () => {
        const classPeriod = document.getElementById('class-period').value.trim();
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += (classPeriod ? 'Class Period: ' + classPeriod + '\n' : '');
        csvContent += "Sprinter,Attempt 1,Manual Correction 1,Attempt 2,Manual Correction 2,Attempt 3,Manual Correction 3\n"; // Headers

        // Loop through the sprintResults object and create a CSV row for each sprinter
        for (const [sprinter, times] of Object.entries(sprintResults)) {
            let row = `"${sprinter}",`;
            for (let i = 0; i < MAX_ATTEMPTS; i++) {
                row += `"${times[i] || ''}",`; // Add times (or empty if undefined)
                row += `"${times[i] || ''}",`; // Manual correction defaults to the recorded time (editable in the table)
            }
            csvContent += row.slice(0, -1) + "\n"; // Remove the trailing comma and add a newline
        }

        // Create a downloadable CSV file and trigger the download
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', 'sprint_results.csv');
        document.body.appendChild(link); // Required for Firefox
        link.click();
        document.body.removeChild(link); // Clean up
    });

    </script>
</body>
</html>
